http_port 3128
# Verificado en vivo (MISSION-DEPS-VERIFY-3): al conectar el proxy a la red interna, Podman pone el DNS de esa red
# (sin salida) primero en resolv.conf y squid fallaba al resolver (TCP_TUNNEL/503 HIER_NONE) de forma intermitente.
dns_nameservers 169.254.1.1 1.1.1.1 8.8.8.8
acl allowed dstdomain api.nuget.org pub.dev storage.googleapis.com
acl CONNECT method CONNECT
acl SSL_ports port 443
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
