services:
  company-core:
    build:
      context: ./app
    container_name: ai-company-core
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CEO_MODEL: qwen2.5-coder:14b
      OLLAMA_AGENT_MODEL: qwen3:8b
      KAFKA_BOOTSTRAP_SERVERS: storm-kafka:19092
      SERVER_PORT: 8081
      EVIDENCE_WEB_SEARCH_API_KEY: ${EVIDENCE_WEB_SEARCH_API_KEY}
      PRODUCTS_WORKSPACE_ROOT: /workspace/products
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    networks:
      - ai-company-net
    volumes:
      - products-workspace:/workspace/products

networks:
  ai-company-net:
    external: true

volumes:
  products-workspace:
