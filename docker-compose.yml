services:
  company-core:
    build:
      context: ./app
    container_name: ai-company-core
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CEO_MODEL: qwen2.5-coder:14b
      OLLAMA_AGENT_MODEL: qwen3:8b
      KAFKA_BOOTSTRAP_SERVERS: storm-kafka:19092
      SERVER_PORT: 8081
      EVIDENCE_WEB_SEARCH_API_KEY: ${EVIDENCE_WEB_SEARCH_API_KEY}
      PRODUCTS_WORKSPACE_ROOT: /data/forjai-products
      SANDBOX_RUNNER_URL: http://sandbox-runner:8090
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    volumes:
      - ${HOME}/forjai-products:/data/forjai-products
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    networks:
      - ai-company-net

  sandbox-runner:
    build:
      context: ./sandbox-runner
    container_name: forjai-sandbox-runner
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN}
      SANDBOX_PRODUCTS_ROOT: ${HOME}/forjai-products
      SANDBOX_WORK_ROOT: ${HOME}/forjai-sandbox-work
      SANDBOX_PODMAN_URL: unix:///run/podman/podman.sock
      HOME: /tmp
    volumes:
      - ${HOME}/forjai-products:${HOME}/forjai-products:ro
      - ${HOME}/forjai-sandbox-work:${HOME}/forjai-sandbox-work
      - /run/user/${UID:-1000}/podman/podman.sock:/run/podman/podman.sock
    networks:
      - ai-company-net

networks:
  ai-company-net:
    external: true
