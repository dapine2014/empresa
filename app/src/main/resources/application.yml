spring:
  application:
    name: company-core
  task:
    scheduling:
      # Búsqueda de prospectos (2026-09-30): una corrida puede tardar minutos (modelo + búsqueda + fetch); con el pool
      # por defecto de un hilo bloqueaba el sondeo de modelos caídos (cada 30 s) y el orquestador.
      pool:
        size: 4
  web:
    # Finanzas (2026-09-27): la pantalla muestra el motivo real de un rechazo (p. ej. "es un prospecto").
    # Verificado en vivo: en Spring Boot 4 server.error.include-message no aplica a este error.
    error:
      include-message: always
  mail:
    # username/password NO van acá: se leen dinámicamente de Neo4j
    # (Company.systemEmail/mailPassword, ver AlertMailService) porque son
    # editables desde el Command Center web sin reiniciar el proceso.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

server:
  port: 8081

company:
  name: Forjai
  events:
    topic: EMPRESA_EVENTS
  seed-capital-usd: 50
  challenge-days: 60

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  ceo-model: ${OLLAMA_CEO_MODEL:qwen2.5-coder:14b}
  agent-model: ${OLLAMA_AGENT_MODEL:qwen3:8b}
  # Una llamada más larga que esto se considera colgada: falla y se reintenta.
  read-timeout: ${OLLAMA_READ_TIMEOUT:15m}

products:
  workspace-root: ${PRODUCTS_WORKSPACE_ROOT:${user.home}/forjai-products}

evidence:
  web-search:
    base-url: ${EVIDENCE_WEB_SEARCH_BASE_URL:https://google.serper.dev}
    api-key: ${EVIDENCE_WEB_SEARCH_API_KEY:}
    # Decisión del fundador (2026-09-28): Forjai busca clientes siempre a nivel mundial. Vacío = sin país ni idioma
    # fijos (SerperSearchAdapter omite gl/hl). Antes CO/es sesgaba toda la evidencia de los agentes a Colombia.
    country: ${EVIDENCE_WEB_SEARCH_COUNTRY:}
    language: ${EVIDENCE_WEB_SEARCH_LANGUAGE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
sandbox:
  runner:
    url: ${SANDBOX_RUNNER_URL:http://localhost:8090}
    token: ${SANDBOX_RUNNER_TOKEN:}
    timeout: ${SANDBOX_RUNNER_TIMEOUT:30m}
# Keys de modelos editables desde Settings (2026-09-29): llave maestra AES-256 (32 bytes en base64) con la que se
# cifran en Neo4j. Solo vive en .env; sin ella las keys solo salen del .env.
forjai:
  secrets-key: ${FORJAI_SECRETS_KEY:}

remote-models:
  base-url: ${REMOTE_MODELS_BASE_URL:https://integrate.api.nvidia.com/v1}
  read-timeout: ${REMOTE_MODELS_READ_TIMEOUT:10m}
  providers:
    nvidia:
      api-key: ${NVIDIA_API_KEY:}
    nvidia-discovery:
      api-key: ${NVIDIA_API_KEY_DISCOVERY:}
    nvidia-creative:
      api-key: ${NVIDIA_API_KEY_CREATIVE:}
    nvidia-ceo:
      api-key: ${NVIDIA_API_KEY_CEO:}
